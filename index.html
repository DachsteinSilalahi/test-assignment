<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Dashboard</title>
  <!-- Inline theme script — MUST run before CSS/body to prevent flash (Req 8.6) -->
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark-mode');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ── Header: Theme Toggle (Req 8.1) ───────────────────────── -->
  <header class="dashboard-header">
    <button id="theme-toggle" aria-label="Toggle dark mode">🌙 Dark Mode</button>
  </header>

  <main class="dashboard-main">

    <!-- ── Greeting Section (Req 2.1–2.8, 3.1–3.8) ───────────── -->
    <section id="greeting-section" class="widget" aria-label="Greeting">
      <div id="clock" aria-live="polite" aria-atomic="true">--:--</div>
      <div id="date"></div>
      <div id="greeting-text"></div>

      <form id="name-form" novalidate>
        <input
          type="text"
          id="username-input"
          maxlength="50"
          placeholder="Enter your name…"
          autocomplete="off"
          aria-label="Your name"
        >
        <button type="submit" id="save-name-btn">Save Name</button>
      </form>

      <button id="edit-name-btn" style="display:none;">✏️ Edit Name</button>
      <div id="greeting-error" role="alert" aria-live="polite"></div>
    </section>

    <!-- ── Focus Timer Section (Req 4.1–4.9) ─────────────────── -->
    <section id="timer-section" class="widget" aria-label="Focus Timer">
      <h2>Focus Timer</h2>
      <div id="timer-display" aria-live="polite" aria-atomic="true">25:00</div>
      <div id="timer-status">Idle</div>
      <div class="timer-controls">
        <button id="timer-start">▶ Start</button>
        <button id="timer-stop" disabled>⏸ Stop</button>
        <button id="timer-reset">↺ Reset</button>
      </div>
    </section>

    <!-- ── Quick Links Section (Req 7.1–7.9) ─────────────────── -->
    <section id="quicklinks-section" class="widget" aria-label="Quick Links">
      <h2>Quick Links</h2>
      <div class="quicklinks-input-row">
        <input
          type="text"
          id="link-label-input"
          maxlength="50"
          placeholder="Label (e.g. GitHub)"
          autocomplete="off"
          aria-label="Link label"
        >
        <input
          type="url"
          id="link-url-input"
          placeholder="URL (https://…)"
          autocomplete="off"
          aria-label="Link URL"
        >
        <button id="add-link-btn">+ Add Link</button>
      </div>
      <div id="link-error" role="alert" aria-live="polite"></div>
      <div id="links-container"></div>
    </section>

    <!-- ── To-Do List Section (Req 5.1–5.17, 6.1–6.7) ────────── -->
    <section id="todo-section" class="widget" aria-label="To-Do List">
      <h2>To-Do List</h2>
      <div class="todo-input-row">
        <input
          type="text"
          id="task-input"
          maxlength="200"
          placeholder="Add a new task…"
          autocomplete="off"
          aria-label="New task text"
        >
        <button id="add-task-btn">+ Add Task</button>
      </div>
      <div id="task-error" role="alert" aria-live="polite"></div>
      <ul id="task-list" aria-label="Task list"></ul>
    </section>

  </main>

  <!-- ── Notification container for toast messages (Req 10.6, 10.7, 10.8) -->
  <div id="notification-container" aria-live="polite" aria-atomic="false"></div>

  <script src="js/script.js"></script>
</body>
</html>
